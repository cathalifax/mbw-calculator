/* ==========================================================================

/* Crisp dark theme: near-black background, charcoal cards, ONE accent (iOS blue), red only for errors / sign out. */
:root{
  --bg:#000; --card:#1c1c1e; --fill:#2c2c2e; --fill2:#2c2c2e;
  --label:#fff; --label2:#b4b4ba; --label3:#8e8e93;

  --green:#0a84ff; --green-d:#4da3ff; --green-t:#2c2c2e;
  --red:#ff453a; --red-d:#ff6961; --red-t:rgba(255,69,58,.16);
  --orange:#b4b4ba; --orange-d:#d1d1d6; --orange-t:#2c2c2e;
  --bar:#000; --thumb:#636366; --track:#2c2c2e;
  --r:26px; --r-sm:14px;

  color-scheme:dark;
}
/* ---------- base ---------- */
html,body{background:var(--bg)}
body{font-family:var(--font);color:var(--label);font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
.wrap{max-width:720px;padding:0 16px 40px}

h1{font-size:34px;line-height:1.12;font-weight:700;letter-spacing:-.02em;margin:10px 0 6px}
h2,#book h2{font-size:22px;font-weight:700;letter-spacing:-.015em;margin:0 0 12px}
h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;color:var(--label2);margin:18px 4px 6px}
.sub,.muted,.hint,.note{color:var(--label2)}
.sub{font-size:15px;line-height:1.4;margin-bottom:12px}
header{padding:0 2px 4px}

/* ---------- inset grouped cards ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:none;padding:18px 16px;margin-bottom:16px}
.card.note{font-size:14px}

/* ---------- form fields: filled iOS style ---------- */
label{font-size:15px;font-weight:600;color:var(--label);margin:16px 0 7px}
input,select,textarea{font-family:var(--font);font-size:17px;min-height:48px;padding:12px 14px;border:0;border-radius:var(--r-sm);background:var(--fill);color:var(--label);-webkit-appearance:none;appearance:none}

/* ---------- buttons ---------- */

  const user = canon(uIn.value), pw = pIn.value, remember = document.getElementById("staticrypt-remember").checked;
  if (!user) { document.getElementById("cat-people").classList.add("bad"); showErr(uIn.value.trim() ? "Unknown username \u201c" + uIn.value.trim() + "\u201d. Use Erdet, Ermal or Liri." : "Tap your name first (Erdet, Ermal or Liri)."); return; }
  if (!pw) { pIn.classList.add("bad"); showErr("Enter the staff password."); pIn.focus(); return; }
  uIn.value = user; markTiles();
  const btn = document.getElementById("cat-signin"); btn.disabled = true; btn.textContent = "Signing in…";
  // store the name BEFORE decrypting: the unlocked page runs immediately and reads it
  const prev = { lu: ls(K.user), su: ss(K.user), who: ls(K.who) };
  if (remember) { ls(K.user, user); ss(K.user, null); } else { ss(K.user, user); ls(K.user, null); }
  ls(K.who, JSON.stringify(user));
  const r = await staticrypt.handleDecryptionOfPage(pw, remember);
  if (r.isSuccessful) {
    ls(K.last, user);
    if (!remember) ss(K.hash, r.hashedPassword); else ss(K.hash, null);
    return;
  }
  // wrong password: put everything back
  ls(K.user, prev.lu); ss(K.user, prev.su); ls(K.who, prev.who);
  btn.disabled = false; btn.textContent = "Sign in";
  pIn.classList.add("bad"); pIn.select(); showErr("Wrong password – try again.");
});
</script>

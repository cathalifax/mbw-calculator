/* ==========================================================================

/* Crisp dark theme: near-black background, charcoal cards, ONE accent (iOS blue), red only for errors / sign out. */
:root{
  --bg:#000; --card:#1c1c1e; --fill:#2c2c2e; --fill2:#2c2c2e;
  --label:#fff; --label2:#b4b4ba; --label3:#8e8e93;
  --sep:#38383a; --blue:#0a84ff; --blue-t:rgba(10,132,255,.18);
  --green:#0a84ff; --green-d:#4da3ff; --green-t:#2c2c2e;
  --red:#ff453a; --red-d:#ff6961; --red-t:rgba(255,69,58,.16);
  --orange:#b4b4ba; --orange-d:#d1d1d6; --orange-t:#2c2c2e;
  --bar:#000; --thumb:#636366; --track:#2c2c2e;
  --r:26px; --r-sm:14px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,Roboto,"Segoe UI",Arial,sans-serif;
  color-scheme:dark;
}
/* ---------- base ---------- */
html,body{background:var(--bg)}
body{font-family:var(--font);color:var(--label);font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
.wrap{max-width:720px;padding:0 16px 40px}

.sub a,.wrap .sub a[style]{color:var(--blue)!important;font-weight:600;text-decoration:none}
h1{font-size:34px;line-height:1.12;font-weight:700;letter-spacing:-.02em;margin:10px 0 6px}
h2,#book h2{font-size:22px;font-weight:700;letter-spacing:-.015em;margin:0 0 12px}
h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;color:var(--label2);margin:18px 4px 6px}
.sub,.muted,.hint,.note{color:var(--label2)}
.sub{font-size:15px;line-height:1.4;margin-bottom:12px}
header{padding:0 2px 4px}

/* ---------- inset grouped cards ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:none;padding:18px 16px;margin-bottom:16px}
.card.note{font-size:14px}

/* ---------- form fields: filled iOS style ---------- */
label{font-size:15px;font-weight:600;color:var(--label);margin:16px 0 7px}
input,select,textarea{font-family:var(--font);font-size:17px;min-height:48px;padding:12px 14px;border:0;border-radius:var(--r-sm);background:var(--fill);color:var(--label);-webkit-appearance:none;appearance:none}

.fok{color:var(--green-d)}
.finfo{color:var(--label2)}
.err{color:var(--red-d)}

/* ---------- buttons ---------- */
.bigbtn{display:block;width:100%;border:0;color:#fff;text-align:center;text-decoration:none;cursor:pointer;-webkit-appearance:none;appearance:none;font-family:var(--font);min-height:54px;padding:15px 16px;border-radius:16px;background:var(--blue);font-size:18px;font-weight:600;letter-spacing:-.01em;box-shadow:none}

/* ---------- lists & tables: hairline separators ---------- */

  if (last && !u.value) u.value = last;
  markTiles();
  if (u.value) document.getElementById("staticrypt-password").focus();
}
window.onload = async function () {
  const q = new URLSearchParams(location.search);
  if (q.has("staticrypt_logout") || location.hash.indexOf("staticrypt_logout") >= 0) {
    clearLogin();
    q.delete("staticrypt_logout"); const s = q.toString();
    try { history.replaceState(null, "", location.pathname + (s ? "?" + s : "")); } catch (e) {}
  }
  let ok = false;
  const user = canon(ss(K.user)) || canon(ls(K.user));
  if (user) {
    const h = ss(K.hash);   // signed in without "keep me signed in": valid for this browser tab session
    if (h) ok = (await staticrypt.handleDecryptionOfPageFromHash(h, false)).isSuccessful;
    if (!ok) ok = (await staticrypt.handleDecryptOnLoad()).isSuccessful;
  } else {
    // remembered password but no username (e.g. signed in before usernames existed): ask once for the name
    ls(templateConfig.rememberPassphraseKey, null); ls(templateConfig.rememberExpirationKey, null);
  }
  if (!ok) showForm();
};
function markTiles() {
  const cur = canon(document.getElementById("cat-username").value);
  document.querySelectorAll("[data-u]").forEach(function (b) { const on = b.getAttribute("data-u") === cur; b.classList.toggle("on", on); b.setAttribute("aria-checked", on ? "true" : "false"); });
}
document.querySelectorAll("[data-u]").forEach(function (b) {
  b.addEventListener("click", function () { const u = document.getElementById("cat-username"); u.value = b.getAttribute("data-u"); document.getElementById("cat-people").classList.remove("bad"); showErr(""); markTiles(); document.getElementById("staticrypt-password").focus(); });
});
document.getElementById("cat-show").addEventListener("click", function () {
  const p = document.getElementById("staticrypt-password"), show = p.type === "password";
  p.type = show ? "text" : "password"; this.textContent = show ? "Hide" : "Show";
});
document.getElementById("cat-username").addEventListener("input", function () { document.getElementById("cat-people").classList.remove("bad"); showErr(""); markTiles(); });
document.getElementById("staticrypt-password").addEventListener("input", function () { this.classList.remove("bad"); showErr(""); });
document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
  e.preventDefault();
  const uIn = document.getElementById("cat-username"), pIn = document.getElementById("staticrypt-password");
  const user = canon(uIn.value), pw = pIn.value, remember = document.getElementById("staticrypt-remember").checked;
  if (!user) { document.getElementById("cat-people").classList.add("bad"); showErr(uIn.value.trim() ? "Unknown username \u201c" + uIn.value.trim() + "\u201d. Use Erdet, Ermal or Liri." : "Tap your name first (Erdet, Ermal or Liri)."); return; }
  if (!pw) { pIn.classList.add("bad"); showErr("Enter the staff password."); pIn.focus(); return; }
  uIn.value = user; markTiles();
  const btn = document.getElementById("cat-signin"); btn.disabled = true; btn.textContent = "Signing in…";
  // store the name BEFORE decrypting: the unlocked page runs immediately and reads it
  const prev = { lu: ls(K.user), su: ss(K.user), who: ls(K.who) };
  if (remember) { ls(K.user, user); ss(K.user, null); } else { ss(K.user, user); ls(K.user, null); }
  ls(K.who, JSON.stringify(user));
  const r = await staticrypt.handleDecryptionOfPage(pw, remember);
  if (r.isSuccessful) {
    ls(K.last, user);
    if (!remember) ss(K.hash, r.hashedPassword); else ss(K.hash, null);
    return;
  }
  // wrong password: put everything back
  ls(K.user, prev.lu); ss(K.user, prev.su); ls(K.who, prev.who);
  btn.disabled = false; btn.textContent = "Sign in";
  pIn.classList.add("bad"); pIn.select(); showErr("Wrong password – try again.");
});
</script>

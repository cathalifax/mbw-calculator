.sub{color:#5a6475;font-size:.95rem}
.card{background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:18px;margin-bottom:16px}
label{display:block;font-weight:600;margin:14px 0 6px}
label.first{margin-top:0}
input{width:100%;font-size:1.15rem;padding:12px;border:1px solid #c7ced9;border-radius:10px;background:#fff;font-family:inherit;color:inherit}
input:focus{outline:3px solid #9cc3ff;border-color:#3b82f6}
input.bad{border-color:#b42318;background:#fff7f7}
.pw{position:relative}.pw input{padding-right:70px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:#1f4e79;font-weight:700;font-size:.95rem;padding:8px;cursor:pointer}
.chk{display:flex;align-items:center;gap:10px;margin-top:14px;font-weight:400;font-size:1rem}
.chk input{width:22px;height:22px;margin:0}

.bigbtn:disabled{opacity:.6}
.hint{font-size:.85rem;color:#5a6475;margin-top:8px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.hint button{border:1px solid #e9c46a;background:#fde68a;color:#7a4b00;border-radius:8px;padding:5px 12px;font-size:.92rem;font-weight:700;cursor:pointer;font-family:inherit}
.err{margin-top:12px;padding:10px 12px;border-radius:10px;background:#fef3f2;color:#b42318;font-weight:600;font-size:.95rem}
.note{font-size:.85rem;color:#5a6475;line-height:1.45;text-align:center}
.spin{display:flex;justify-content:center;padding-top:30vh}
.spin div{width:40px;height:40px;border:4px solid #c7ced9;border-top-color:#1f4e79;border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
</style>
